[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keysuite"
version = "1.1.0.dev3"
description = "Reference runtime for GDk9 symbolic implication infrastructure"
authors = [{name="GDk9"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["gdk9", "keysuite", "ime", "symbolic-input", "deterministic-runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "pyyaml>=6.0,<7",
    "packaging>=24,<27",
    "tomli>=2.0,<3; python_version<'3.11'",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
keysuite = "keysuite.cli:main"

[project.urls]
Homepage = "https://github.com/ao3575911/gdk9_keysuite"
Documentation = "https://github.com/ao3575911/gdk9_keysuite/tree/main/site"
Standards = "https://github.com/ao3575911/gdk9_keysuite/tree/main/standards"

[tool.setuptools.packages.find]
include = ["keysuite*", "reference*"]

[tool.setuptools.package-data]
keysuite = ["data/*.yaml"]

[tool.setuptools.data-files]
"share/keysuite/grammar" = [
    "grammar/gdk9-v1.0.0.yaml",
    "grammar/gdk9-v1.0.0-2.yaml",
    "grammar/gdk9-v1.0.0-3.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
