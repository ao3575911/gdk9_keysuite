[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keysuite"
version = "1.0.0"
description = "Reference runtime for GDk9 symbolic implication infrastructure"
authors = [{name="GDk9"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["gdk9", "keysuite", "ime", "symbolic-input", "deterministic-runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
]
dependencies = ["pyyaml>=6.0,<7"]

[project.scripts]
keysuite = "reference.keysuite.src.main:main"

[project.urls]
Homepage = "https://github.com/ao3575911/gdk9_keysuite"
Documentation = "https://github.com/ao3575911/gdk9_keysuite/tree/main/site"
Standards = "https://github.com/ao3575911/gdk9_keysuite/tree/main/standards"

[tool.setuptools.packages.find]
include = ["reference*"]

[tool.setuptools.data-files]
"share/keysuite/grammar" = ["grammar/gdk9-v1.0.0.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
